name: Hourly Nerds monitoring

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nerds-hourly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the hourly monitoring check
        env:
          MONITOR_URL: https://ping.adi.rest/api/monitor/run
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add CRON_SECRET to repository Actions secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            --retry 2 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "$MONITOR_URL"
